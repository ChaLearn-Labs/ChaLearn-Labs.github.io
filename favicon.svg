<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <!-- Background Grid Pattern -->
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#E5E9F0" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="200" height="200" fill="#FFFFFF" />
  <rect width="200" height="200" fill="url(#grid)" opacity="0.6"/>

  <!-- 4x4 DOT MATRIX WITH CUSTOM COLORS -->
  <g transform="translate(10, 10)">
    <!-- Column 1 (Left): Solid Color 1 -->
    <circle cx="25" cy="25" r="16" fill="#7d1f53"/>
    <circle cx="25" cy="68" r="16" fill="#7d1f53"/>
    <circle cx="25" cy="111" r="16" fill="#7d1f53"/>
    <circle cx="25" cy="154" r="16" fill="#7d1f53"/>

    <!-- Column 2: Bordered Color 3 (Top), Solid Color 2 (Middle), Solid Color 1 (Bottom) -->
    <circle cx="68" cy="25" r="14.5" fill="none" stroke="#be4e29" stroke-width="3"/>
    <circle cx="68" cy="68" r="16" fill="#f37c20"/>
    <circle cx="68" cy="111" r="16" fill="#f37c20"/>
    <circle cx="68" cy="154" r="16" fill="#7d1f53"/>

    <!-- Column 3: Bordered Color 3 (Top), Solid Color 2 (Middle), Solid Color 1 (Bottom) -->
    <circle cx="111" cy="25" r="14.5" fill="none" stroke="#be4e29" stroke-width="3"/>
    <circle cx="111" cy="68" r="16" fill="#f37c20"/>
    <circle cx="111" cy="111" r="16" fill="#f37c20"/>
    <circle cx="111" cy="154" r="16" fill="#7d1f53"/>

    <!-- Column 4 (Right): All Bordered Color 3 -->
    <circle cx="154" cy="25" r="14.5" fill="none" stroke="#be4e29" stroke-width="3"/>
    <circle cx="154" cy="68" r="14.5" fill="none" stroke="#be4e29" stroke-width="3"/>
    <circle cx="154" cy="111" r="14.5" fill="none" stroke="#be4e29" stroke-width="3"/>
    <circle cx="154" cy="154" r="14.5" fill="none" stroke="#be4e29" stroke-width="3"/>
  </g>
</svg>
